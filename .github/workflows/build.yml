name: Build VisualControl
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Publish Server
      shell: pwsh
      run: |
        dotnet publish Server/VisualControl.Server.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o publish/Server
    - name: Publish Client
      shell: pwsh
      run: |
        dotnet publish Client/VisualControl.Client.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o publish/Client
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0-${{ github.run_number }}
        name: "VisualControl v1.0"
        body: |
          分布式可视化中控系统 (自包含，无需安装运行时)
          - VisualControlServer.exe: 控制端
          - VisualControlClient.exe: 显示端
        files: |
          publish/Server/VisualControlServer.exe
          publish/Client/VisualControlClient.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
