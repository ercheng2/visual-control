name: Build VisualControl
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Publish Server
      shell: pwsh
      run: |
        dotnet publish Server/VisualControl.Server.csproj -c Release -r win-x64 --self-contained false -o publish/Server
        Compress-Archive -Path publish/Server/* -DestinationPath publish/VisualControlServer.zip
    - name: Publish Client
      shell: pwsh
      run: |
        dotnet publish Client/VisualControl.Client.csproj -c Release -r win-x64 --self-contained false -o publish/Client
        Compress-Archive -Path publish/Client/* -DestinationPath publish/VisualControlClient.zip
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0-${{ github.run_number }}
        name: "VisualControl v1.0"
        body: |
          分布式可视化中控系统
          - VisualControlServer.zip: 控制端（设备管理、文件分发、远程桌面）
          - VisualControlClient.zip: 显示端（后台托盘运行，接受控制）
          - 运行需要 .NET Framework 4.8
        files: |
          publish/VisualControlServer.zip
          publish/VisualControlClient.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
